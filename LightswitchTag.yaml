blueprint:
  name: Speaker with Lamp
  description: Toggles a speaker with the Lamp
  domain: automation
  input:
    lamp:
      name: Lamp
      description: The Lamp that will be toggled via Tag
      selector:
        entity:
          filter:
            - domain: light
    nfc-tag:
      name: NFC-Tag
      description: The NFC-Tag that will toggle the Lamp
      selector:
        entity:
          filter:
            - domain: tag

triggers:
  - trigger: tag
    tag_id: !input nfc-tag
actions:
  - action: light.toggle
    target:
      entity_id: !input lamp
    data: { }
mode: single
